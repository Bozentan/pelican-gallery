<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelican and a Day at the Lighthouse</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324d;
      --paper: #fffdf7;
      --coral: #ed6d4b;
      --gold: #f6c95f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px 0;
      background: #d9eef4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(1120px, 96vw);
      overflow: hidden;
      border: 1px solid rgba(23, 50, 77, .16);
      border-radius: 24px;
      background: white;
      box-shadow: 0 24px 70px rgba(23, 50, 77, .2);
    }
    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 22px;
      color: var(--ink);
      background: var(--paper);
      font-size: clamp(1rem, 2.6vw, 1.32rem);
      font-weight: 800;
      letter-spacing: .015em;
    }
    .controls { display: flex; gap: 8px; }
    button {
      border: 1px solid var(--ink);
      border-radius: 999px;
      padding: 8px 15px;
      color: var(--ink);
      background: white;
      font: inherit;
      font-size: .8rem;
      cursor: pointer;
    }
    button:hover { background: #fff0d9; }
    button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    svg { display: block; width: 100%; height: auto; background: #9ce1f2; }
    .scene { transition: opacity .45s ease; }
    .hidden { opacity: 0; pointer-events: none; }
    .show { opacity: 1; }
    .cloud { animation: drift 24s linear infinite; }
    .cloud.slow { animation-duration: 38s; animation-delay: -16s; }
    .wave { animation: wave 2.5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .flag { animation: wave-flag .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
    .screen-glow { animation: glow 1.4s ease-in-out infinite alternate; }
    .cursor { animation: blink .85s steps(2, start) infinite; }
    .angry-mark { animation: shake .18s linear infinite alternate; transform-box: fill-box; transform-origin: center; }
    .splash { animation: pop .7s ease-out both; }
    @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(1080px); } }
    @keyframes wave { from { transform: translateY(0); } to { transform: translateY(5px); } }
    @keyframes wave-flag { from { transform: skewY(0deg); } to { transform: skewY(-9deg); } }
    @keyframes glow { from { opacity: .45; } to { opacity: .95; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes shake { from { transform: translateX(-2px) rotate(-3deg); } to { transform: translateX(2px) rotate(3deg); } }
    @keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
<style id="pelican-preview-layout">
#status { display: none !important; }
html.pelican-embedded { min-height: 0 !important; height: auto !important; overflow: hidden; }
.pelican-embedded body { min-height: 0 !important; height: auto !important; display: flow-root !important; width: 100%; box-sizing: border-box; overflow: hidden; }
.pelican-embedded body > main, .pelican-embedded body > .card, .pelican-embedded .page { max-width: 100%; margin-left: auto; margin-right: auto; }
.pelican-embedded :is(header, .title, .controls, nav, .transport, footer) { flex-wrap: wrap; }
.pelican-embedded :is(header, .title, .controls, nav, .transport, footer) > * { min-width: 0; }
.pelican-embedded :is(h1, .eyebrow) { overflow-wrap: anywhere; }
.pelican-embedded input[type="range"] { max-width: 100%; }
</style>

</head>
<body>

    <div id="status" aria-live="polite" style="padding:10px 22px 14px;color:#537087;font-size:.8rem">Episode 1 · ride to work</div>

  <script>
    const card = document.querySelector('.card');
    const toggle = document.getElementById('toggle');
    const replay = document.getElementById('replay');
    const status = document.getElementById('status');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const el = id => document.getElementById(id);
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const ease = n => n < .5 ? 4 * n * n * n : 1 - Math.pow(-2 * n + 2, 3) / 2;
    const lerp = (a, b, n) => a + (b - a) * n;
    const duration = 36000;
    let time = 0;
    let previous = null;
    let paused = reducedMotion.matches;
    let frame = null;

    function setOpacity(id, value) { el(id).style.opacity = value; }
    function setScene(id, value) { el(id).classList.toggle('show', value); el(id).classList.toggle('hidden', !value); }

    function drawRide(seconds) {
      const p = ease(clamp(seconds / 10, 0, 1));
      const x = lerp(-260, 350, p);
      el('rideMotion').setAttribute('transform', `translate(${x} 0)`);
      const spin = seconds * 250;
      el('rideRear').setAttribute('transform', `rotate(${spin} 350 474)`);
      el('rideFront').setAttribute('transform', `rotate(${spin} 650 474)`);
      el('rideCaption').style.opacity = seconds < 8.7 ? '1' : '0';
      status.textContent = seconds < 10 ? 'Episode 1 · ride to work' : 'Episode 1 · lighthouse ahead';
    }

    function drawOffice(seconds) {
      const local = seconds - 12;
      const arrival = clamp(local / 2, 0, 1);
      el('officePelican').setAttribute('transform', `translate(${lerp(185, 140, ease(arrival))} 0)`);
      setOpacity('officeBubble', local < 4 ? 1 : 0);
      setOpacity('screenWelcome', local < 5 ? 1 : 0);
      setOpacity('screenError', local >= 5 ? 1 : 0);
      setOpacity('errorBubble', local >= 5 && local < 10 ? 1 : 0);
      setOpacity('angryMarks', local >= 6 ? 1 : 0);
      setOpacity('throwCaption', local >= 10 ? 1 : 0);
      status.textContent = local < 5 ? 'Episode 2 · opens the office and turns on the computer' : local < 10 ? 'Episode 2 · ChatGPT is not responding' : 'Episode 3 · computer flies toward the window';

      const throwing = local >= 10;
      setOpacity('windowOpen', throwing ? 1 : 0);
      setOpacity('flightTrail', throwing ? 1 : 0);
      setOpacity('flyingComputer', throwing ? 1 : 0);
      setOpacity('splash', local >= 12 ? 1 : 0);
      // The throw uses a separate flying computer, leaving the desk monitor
      // readable until the moment it disappears through the window.
      el('officeComputer').style.opacity = 0;
      el('monitor').style.opacity = throwing ? 0 : 1;
      if (throwing) {
        const launch = clamp((local - 10) / 2.5, 0, 1);
        const q = ease(launch);
        const fx = lerp(465, 805, q);
        const fy = lerp(295, 164, q) - Math.sin(q * Math.PI) * 90;
        el('flyingComputer').firstElementChild.setAttribute('transform', `translate(${fx} ${fy}) rotate(${lerp(0, 330, q)})`);
        el('officePelican').setAttribute('transform', `translate(${115 - q * 25} ${-Math.sin(q * Math.PI) * 3}) rotate(${q * -4})`);
      }
    }

    function render() {
      const seconds = time / 1000;
      const ride = seconds < 12;
      const office = seconds >= 10 && seconds < 31;
      const ending = seconds >= 31;
      setScene('rideScene', ride);
      setScene('officeScene', office);
      setScene('endCard', ending);
      if (ride) drawRide(seconds);
      if (office) drawOffice(seconds);
      if (ending) status.textContent = 'Finale · until the next episode';
    }

    function tick(now) {
      frame = null;
      if (paused || document.hidden) return;
      if (previous !== null) time = (time + Math.min(now - previous, 80)) % duration;
      previous = now;
      render();
      frame = requestAnimationFrame(tick);
    }

    function sync() {
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;
      previous = null;
      card.classList.toggle('paused', paused || document.hidden);
      toggle.textContent = paused ? 'Resume' : 'Pause';
      toggle.setAttribute('aria-pressed', String(paused));
      if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
    }

    toggle.addEventListener('click', () => { paused = !paused; sync(); });
    replay.addEventListener('click', () => { time = 0; render(); paused = false; sync(); });
    reducedMotion.addEventListener('change', event => { paused = event.matches; sync(); });
    document.addEventListener('visibilitychange', sync);
    render();
    sync();
  </script>
<script id="pelican-preview-sizing">
(() => {
  if (window.parent === window) return;
  document.documentElement.classList.add('pelican-embedded');
  let pending = false;
  let lastHeight = 0;
  function measure() {
    pending = false;
    if (document.documentElement.clientWidth === 0) return;
    const height = Math.ceil(document.body.getBoundingClientRect().height) + 2;
    if (height > 0 && height !== lastHeight) {
      lastHeight = height;
      window.parent.postMessage({type: 'pelican-preview-height', height}, '*');
    }
  }
  function schedule() {
    if (!pending) { pending = true; requestAnimationFrame(measure); }
  }
  new ResizeObserver(schedule).observe(document.body);
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  window.addEventListener('message', event => {
    if (event.source === window.parent && event.data?.type === 'pelican-preview-measure') {
      lastHeight = 0;
      schedule();
    }
  });
  document.fonts.ready.then(schedule);
  schedule();
})();
</script>
