const $=id=>document.getElementById(id),clamp=v=>Math.max(0,Math.min(1,v)),mix=(a,b,u)=>a+(b-a)*clamp(u),ease=u=> {

  $('walkLegs').setAttribute('d',`M-20 133L${-30+Math.sin(t*17)*17} 180H${-8+Math.sin(t*17)*17}M22 137L${40-Math.sin(t*17)*17} 180H${63-Math.sin(t*17)*17}`);
  let a=Math.min(t,13)*8,px=91+21*Math.cos(a),py=21*Math.sin(a),bx=91-21*Math.cos(a),by=-21*Math.sin(a);
  $('legBack').setAttribute('d',`M65-132L${80-25*Math.cos(a)} -64L${bx} ${by}`);
  $('crank').setAttribute('d',`M${bx} ${by}L${px} ${py}M${px-12} ${py}H${px+12}M${bx-12} ${by}H${bx+12}`);
  $('leg').setAttribute('d',`M65-132L${80+25*Math.cos(a)} -64L${px} ${py}`);
  tr('clouds',`translate(${Math.sin(t/12)*25} 0)`);
  show('flying',t>=36&&t<39.5);
  let f=clamp((t-36)/3.5);

let cx=682,cy=351,rot=0;

  cy=mix(351,260,u);

  } else if(t>=32&&t<33) {

  rot=mix(-18,-35,u)
  } else if(t>=33) {

  show('errorCard',t>=23&&t<30);

  $('screenMessage').textContent=t<23?'Connecting…':'Unavailable';

  let u=Math.sin(clamp((t-17)/3)*Math.PI);

let ch=t<10?0:t<15?1:t<23?2:t<32?3:t<42?4:5;

  $('seek').value=t;

  }

<script id="pelican-preview-sizing">
(() => {
  if (window.parent === window) return;
  document.documentElement.classList.add('pelican-embedded');
  let pending = false;
  let lastHeight = 0;
  function measure() {
    pending = false;
    if (document.documentElement.clientWidth === 0) return;
    const height = Math.ceil(document.body.getBoundingClientRect().height) + 2;
    if (height > 0 && height !== lastHeight) {
      lastHeight = height;
      window.parent.postMessage({type: 'pelican-preview-height', height}, '*');
    }
  }
  function schedule() {
    if (!pending) { pending = true; requestAnimationFrame(measure); }
  }
  new ResizeObserver(schedule).observe(document.body);
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  window.addEventListener('message', event => {
    if (event.source === window.parent && event.data?.type === 'pelican-preview-measure') {
      lastHeight = 0;
      schedule();
    }
  });
  document.fonts.ready.then(schedule);
  schedule();
})();
</script>
