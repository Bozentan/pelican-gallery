<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican on Two Wheels</title>
  <style>
    :root {
      --ink: #18324b;
      --sky-bottom: #e5f7ff;
      --panel: rgba(255, 255, 255, 0.86);
      --accent: #f26b4a;
      --teal: #169b9d;
      --gold: #f9c85c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: ui-rounded, "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 16% 12%, rgba(255,255,255,.75) 0 4%, transparent 5%),
        radial-gradient(circle at 87% 18%, rgba(255,255,255,.62) 0 5%, transparent 6%),
        linear-gradient(145deg, #f7dd9a 0%, #f7ad83 47%, #cc8c9b 100%);
    }
    .card {
      width: min(1080px, 100%);
      overflow: hidden;
      border: 1px solid rgba(24, 50, 75, .12);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 65px rgba(57, 45, 76, .24), 0 4px 12px rgba(57, 45, 76, .08);
      backdrop-filter: blur(14px);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      padding: 24px 28px 18px;
    }
    .eyebrow { margin: 0 0 7px; color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font-size: clamp(1.7rem, 3vw, 2.55rem); letter-spacing: -.045em; line-height: 1; }
    .hint { max-width: 280px; margin: 0; color: rgba(24, 50, 75, .7); font-size: .92rem; line-height: 1.45; text-align: right; }
    .stage-wrap { position: relative; padding: 0 20px 20px; }
    svg { display: block; width: 100%; height: auto; border-radius: 22px; background: var(--sky-bottom); }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding: 16px 28px 21px; border-top: 1px solid rgba(24, 50, 75, .1); background: rgba(255,255,255,.46); }
    button { border: 0; border-radius: 999px; padding: 10px 16px; color: white; background: var(--ink); font: inherit; font-size: .9rem; font-weight: 750; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; box-shadow: 0 5px 12px rgba(24,50,75,.18); }
    button:hover { transform: translateY(-1px); box-shadow: 0 7px 15px rgba(24,50,75,.24); }
    button:active { transform: translateY(1px); }
    button.secondary { color: var(--ink); background: #fff; }
    .speed { display: flex; align-items: center; gap: 10px; margin-left: auto; color: rgba(24,50,75,.74); font-size: .86rem; font-weight: 700; }
    input[type="range"] { width: 150px; accent-color: var(--accent); cursor: pointer; }

    .cloud { animation: floatCloud 18s linear infinite; }
    .cloud.slow { animation-duration: 28s; animation-delay: -9s; }
    .reed { transform-box: fill-box; transform-origin: bottom center; animation: sway 3s ease-in-out infinite; }
    .reed:nth-child(2n) { animation-delay: -.8s; animation-duration: 3.7s; }
    .reed:nth-child(3n) { animation-delay: -1.4s; animation-duration: 4.2s; }
    .bird-shadow { animation: shadowBreathe 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pelican { animation: rideBob 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .body-feather { animation: featherLift 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    .wing { animation: wingFlap 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 26% 75%; }
    .leg-front, .leg-back { transform-box: fill-box; transform-origin: top center; animation: pedal 1.1s linear infinite; }
    .leg-back { animation-delay: -.55s; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .chain-ring { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite reverse; }
    .road-dash { animation: roadMove 1.1s linear infinite; }
    .spark { animation: sparkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spark:nth-child(2) { animation-delay: -.6s; }
    .spark:nth-child(3) { animation-delay: -1.2s; }
    .paused * { animation-play-state: paused !important; }
    @keyframes floatCloud { from { transform: translateX(-90px); } to { transform: translateX(1050px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes rideBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes featherLift { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-2deg); } }
    @keyframes wingFlap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }
    @keyframes pedal { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes roadMove { from { transform: translateX(0); } to { transform: translateX(-96px); } }
    @keyframes shadowBreathe { 0%, 100% { transform: scaleX(1); opacity: .23; } 50% { transform: scaleX(.9); opacity: .16; } }
    @keyframes sparkle { 0%, 100% { opacity: .1; transform: scale(.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(90deg); } }
    @media (max-width: 700px) {
      body { padding: 10px; }
      header { display: block; padding: 20px 20px 14px; }
      .hint { margin-top: 10px; text-align: left; }
      .stage-wrap { padding: 0 10px 10px; }
      .controls { padding-inline: 20px; }
      .speed { width: 100%; margin-left: 0; }
      input[type="range"] { flex: 1; }
    }
  </style>
<style id="pelican-preview-layout">
html.pelican-embedded { min-height: 0 !important; height: auto !important; overflow: hidden; }
.pelican-embedded body { min-height: 0 !important; height: auto !important; display: flow-root !important; width: 100%; box-sizing: border-box; overflow: hidden; }
.pelican-embedded body > main, .pelican-embedded body > .card, .pelican-embedded .page { max-width: 100%; margin-left: auto; margin-right: auto; }
.pelican-embedded :is(header, .title, .controls, nav, .transport, footer) { flex-wrap: wrap; }
.pelican-embedded :is(header, .title, .controls, nav, .transport, footer) > * { min-width: 0; }
.pelican-embedded :is(h1, .eyebrow) { overflow-wrap: anywhere; }
.pelican-embedded input[type="range"] { max-width: 100%; }
</style>

</head>
<body>

    <header>
      <div><p class="eyebrow">A seaside joyride</p><h1>Pelican on two wheels</h1></div>

        <g class="spark" fill="#f9c85c"><path d="M290 410 l5 12 12 5-12 5-5 12-5-12-12-5 12-5Z"/><path d="M762 337 l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/><path d="M742 405 l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></g>
        <text x="52" y="555" fill="#e7f8f2" font-size="15" font-weight="700" letter-spacing=".12em">SEASIDE LOOP • KEEP PEDALING</text>
      </svg>
    </div>
    <div class="controls">
      <button id="toggle" type="button" aria-pressed="false">Pause ride</button>
      <button id="reset" class="secondary" type="button">Reset motion</button>
      <label class="speed" for="speed">Pedal speed <input id="speed" type="range" min="0.55" max="1.8" step="0.05" value="1" /></label>
    </div>
  </main>
  <script>
    const scene = document.querySelector('#scene');
    const toggle = document.querySelector('#toggle');
    const reset = document.querySelector('#reset');
    const speed = document.querySelector('#speed');
    const animatedSelectors = ['.cloud', '.reed', '.bird-shadow', '.pelican', '.body-feather', '.wing', '.leg-front', '.leg-back', '.wheel', '.chain-ring', '.road-dash', '.spark'];
    function setSpeed(multiplier) {
      animatedSelectors.forEach((selector) => {
        scene.querySelectorAll(selector).forEach((element) => {
          const current = parseFloat(getComputedStyle(element).animationDuration) || 1;
          element.style.animationDuration = (current / multiplier) + 's';
        });
      });
    }
    toggle.addEventListener('click', () => {
      const paused = scene.classList.toggle('paused');
      toggle.textContent = paused ? 'Resume ride' : 'Pause ride';
      toggle.setAttribute('aria-pressed', String(paused));
    });
    reset.addEventListener('click', () => {
      scene.classList.add('paused');
      void scene.offsetWidth;
      scene.classList.remove('paused');
      toggle.textContent = 'Pause ride';
      toggle.setAttribute('aria-pressed', 'false');
      speed.value = '1';
      setSpeed(1);
    });
    speed.addEventListener('input', (event) => setSpeed(Number(event.target.value)));
  </script>
<script id="pelican-preview-sizing">
(() => {
  if (window.parent === window) return;
  document.documentElement.classList.add('pelican-embedded');
  let pending = false;
  let lastHeight = 0;
  function measure() {
    pending = false;
    if (document.documentElement.clientWidth === 0) return;
    const height = Math.ceil(document.body.getBoundingClientRect().height) + 2;
    if (height > 0 && height !== lastHeight) {
      lastHeight = height;
      window.parent.postMessage({type: 'pelican-preview-height', height}, '*');
    }
  }
  function schedule() {
    if (!pending) { pending = true; requestAnimationFrame(measure); }
  }
  new ResizeObserver(schedule).observe(document.body);
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  window.addEventListener('message', event => {
    if (event.source === window.parent && event.data?.type === 'pelican-preview-measure') {
      lastHeight = 0;
      schedule();
    }
  });
  document.fonts.ready.then(schedule);
  schedule();
})();
</script>
</body>
</html>
