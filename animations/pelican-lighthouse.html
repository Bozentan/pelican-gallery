      $('bubble-text').textContent=time<24?'Well, let’s work!':time<28?'What if I try again?..':'WHAT IS GOING ON!';
      $('bubble-second').textContent=time<24?'Coffee. Sea. ChatGPT.':time<28?'Click. Click. Click.':'Restarting now.';
      tr('office-shake',time>=28.5&&time<30.5?`translate(${Math.sin(time*40)*1.4} ${Math.cos(time*31)})`:'translate(0 0)');
      opacity('whoosh',Math.sin(progress(time,33,34)*PI));
    }
    if(time>=34){
      const flight=progress(time,34,36.2),landed=time>=36.2;
      const fx=mix(726,1048,flight),fy=391-205*Math.sin(flight*PI)+308*flight*flight;
      tr('flying-computer',landed?'translate(1048 695) rotate(19) scale(.36)':`translate(${fx} ${fy}) rotate(${mix(40,395,flight)}) scale(.36)`);
      opacity('flying-computer',1);
      opacity('flight-trails',time<36.2?Math.sin(flight*PI)*.8:0);
      const impact=progress(time,36.2,37.8);opacity('impact',landed?1-smooth(impact):0);
      tr('impact-cloud',`translate(1045 696) scale(${1+impact*.7}) translate(-1045 -696)`);
      opacity('white-flag',smooth(progress(time,37.6,38.3)));
      attr('flag-cloth','d',`M1057 621Q1076 ${615+Math.sin(time*4)*6} 1098 622V651Q1075 ${644+Math.sin(time*4)*6} 1057 651Z`);
      opacity('end-card',smooth(progress(time,39,40.5)));
      const light=smooth(progress(time,39,40));opacity('beacon',light);opacity('beacon-glint',light);
      tr('beacon',`translate(660 222) scale(${.72+.28*Math.sin((time-38)*.8)},1) translate(-660 -222)`);
      tr('outro-gull',`translate(${1138-(time-34)*21} ${405+Math.sin(time*2.5)*11})`);
      tr('outro-waves',`translate(${Math.sin(time*.7)*11} 0)`);
      opacity('outro-eyebrow',1-smooth(progress(time,38,40)));
      tr('window-pelican',`translate(650 ${452+Math.sin(time*1.8)*1.5}) scale(.34)`);
    }
    // Brief paper-colored dissolves cover the two scene cuts.
    const dissolve=Math.max(1-Math.abs(time-17.5)/.35,1-Math.abs(time-34)/.16,0);
    opacity('transition',dissolve);
    const ci=time<13?0:time<18?1:time<24?2:time<31?3:4;
    if(ci!==chapter){chapter=ci;$('scene-label').textContent=chapterNames[ci];$('accessible-scene').textContent=chapterDescriptions[ci];chapterButtons.forEach((b,i)=>{b.classList.toggle('active',i===ci);if(i===ci)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')})}
    $('seek').value=time;$('seek').setAttribute('aria-valuetext',`${Math.floor(time)} seconds of 46`);$('elapsed').textContent=`0:${String(Math.floor(time)).padStart(2,'0')}`;
  }
  function updatePlay(){
    $('play').setAttribute('aria-label',playing?'Pause':t>=DURATION?'Watch from the beginning':'Play');
    $('play-icon').innerHTML=playing?'<path d="M5 3H8V17H5ZM12 3H15V17H12Z"/>':'<path d="M5 2L18 10L5 18Z"/>';
  }
  function tick(now){
    if(!playing){frame=0;return}
    const before=t;t=Math.min(DURATION,t+Math.min((now-last)/1000,.08));last=now;
    for(const event of soundEvents){if(event.at>before&&event.at<=t)playSound(event.type)}
    draw(t);if(t>=DURATION){playing=false;updatePlay();frame=0;return}frame=requestAnimationFrame(tick);
  }
  function setPlaying(value){playing=value;updatePlay();if(playing){last=performance.now();if(!frame)frame=requestAnimationFrame(tick)}else{cancelAnimationFrame(frame);frame=0}}
  function jump(value){t=clamp(value,0,DURATION);draw(t);last=performance.now();if(t>=DURATION)setPlaying(false)}
  $('play').addEventListener('click',()=>{if(t>=DURATION)jump(0);setPlaying(!playing)});
  $('replay').addEventListener('click',()=>{jump(0);setPlaying(true)});
  $('seek').addEventListener('input',event=>jump(Number(event.target.value)));
  chapterButtons.forEach(button=>button.addEventListener('click',()=>{jump(Number(button.dataset.time));setPlaying(true)}));
  // Optional synthesized foley; no downloads or external media are needed.
  function tone(freq,duration,type='sine',volume=.08,delay=0,endFreq=freq){
    if(!audio||!soundOn)return;const start=audio.currentTime+delay,osc=audio.createOscillator(),gain=audio.createGain();
    osc.type=type;osc.frequency.setValueAtTime(freq,start);osc.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),start+duration);
    gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
    osc.connect(gain);gain.connect(audio.destination);osc.start(start);osc.stop(start+duration+.025);
  }
  function noise(duration,volume,filterFreq){
    if(!audio||!soundOn)return;const n=Math.ceil(audio.sampleRate*duration),buffer=audio.createBuffer(1,n,audio.sampleRate),data=buffer.getChannelData(0);
    for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);
    const source=audio.createBufferSource(),gain=audio.createGain(),filter=audio.createBiquadFilter();source.buffer=buffer;filter.type='lowpass';filter.frequency.value=filterFreq;gain.gain.value=volume;source.connect(filter);filter.connect(gain);gain.connect(audio.destination);source.start();
  }
  function playSound(type){
    if(!soundOn||!audio)return;
    if(type==='bell'){tone(1320,.7,'sine',.09);tone(1760,.55,'sine',.045,.13)}
    if(type==='door'){tone(120,.17,'triangle',.10,0,55);noise(.15,.07,1200)}
    if(type==='click'){tone(740,.045,'square',.025,0,330)}
    if(type==='boot'){tone(330,.25,'sine',.05);tone(440,.35,'sine',.05,.17);tone(660,.4,'sine',.045,.34)}
    if(type==='error'){tone(230,.25,'triangle',.085,0,180);tone(180,.4,'triangle',.07,.26,100)}
    if(type==='whoosh')noise(.7,.19,1800);
    if(type==='crash'){noise(.6,.32,2800);tone(90,.45,'triangle',.18,0,30);tone(430,.2,'square',.03,.16,130)}
  }
  $('sound').addEventListener('click',async()=>{
    try{
      if(!audio){const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext){$('sound').title='This browser does not support sound';return}audio=new AudioContext()}
      soundOn=!soundOn;if(soundOn)await audio.resume();else await audio.suspend();
      $('sound').setAttribute('aria-pressed',String(soundOn));$('sound').setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on');
      $('sound-waves').setAttribute('d',soundOn?'M14 6Q18 10 14 14M16 3Q22 10 16 17':'M14 7L18 13M18 7L14 13');
      if(soundOn)playSound('bell');
}catch{soundOn=false;$('sound').setAttribute('aria-pressed','false');$('sound').setAttribute('aria-label','Sound unavailable')}
  });
  // Native controls keep keyboard access. Space pauses when focus is outside a control.
  document.addEventListener('keydown',event=>{if(event.code==='Space'&&!/^(INPUT|BUTTON|SELECT|TEXTAREA)$/.test(event.target.tagName)){event.preventDefault();if(t>=DURATION)jump(0);setPlaying(!playing)}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlaying(false)});
  draw(0);updatePlay();if(playing){last=performance.now();frame=requestAnimationFrame(tick)}
})();
</script>
<script id="pelican-preview-sizing">
(() => {
  if (window.parent === window) return;
  document.documentElement.classList.add('pelican-embedded');
  let pending = false;
  let lastHeight = 0;
  function measure() {
    pending = false;
    if (document.documentElement.clientWidth === 0) return;
    const height = Math.ceil(document.body.getBoundingClientRect().height) + 2;
    if (height > 0 && height !== lastHeight) {
      lastHeight = height;
      window.parent.postMessage({type: 'pelican-preview-height', height}, '*');
    }
  }
  function schedule() {
    if (!pending) { pending = true; requestAnimationFrame(measure); }
  }
  new ResizeObserver(schedule).observe(document.body);
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  window.addEventListener('message', event => {
    if (event.source === window.parent && event.data?.type === 'pelican-preview-measure') {
      lastHeight = 0;
      schedule();
    }
  });
  document.fonts.ready.then(schedule);
  schedule();
})();
</script>
